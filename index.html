/* --------------------------------------------------------------- token -- */
:root{
  /* 字族 */
  --fal-display:"Public Sans","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --fal-ui:"Public Sans","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --fal-mono:"Chivo Mono","SFMono-Regular",Menlo,Consolas,monospace;

  /* 品牌色 —— 蓝色系（2026-08-04 改）
     实测取值：#115EF3 是 fal 的链接色，等于它的 --info-600 hsl(220 90% 51%)；
     #1DCBF7 = --brand-cyan-solid hsl(192 93% 54%)；#142657 是顶栏/页脚的大面积深底。
     原来的紫色 #7630F8 降级为次要点缀，只留在海报色里，不再承担界面主色。 */
  --fal-primary:#115ef3;
  --fal-primary-hover:#0d4ad2;
  --fal-primary-weak:#dbecff;      /* --info-100 hsl(212 100% 93%) */
  --fal-primary-ink:#1641b6;       /* --info-700 hsl(224 78% 40%) */
  --fal-navy:#142657;              /* 实测大面积深蓝底 */
  --fal-secondary:#1dcbf7;
  --fal-secondary-weak:#e2f8ff;

  /* 海报色（fal 官网营销面用的高彩平涂色，只用于图形块与强调面，不做界面底色） */
  --fal-poster-cyan:#99edff;
  --fal-poster-blue:#115ef3;
  --fal-poster-navy:#142657;
  --fal-poster-lime:#c8ff3d;
  --fal-poster-pink:#ffc4d8;
  --fal-poster-violet:#7630f8;     /* 保留但降级：只做点缀，不做主色 */

  /* 语义色（由 fal HSL token 换算）
     info 改到青色一侧，避免和蓝色主色撞到一起分不出「操作」与「提示」。 */
  --fal-error:#f00550;   --fal-error-weak:#ffe8ee;
  --fal-warning:#ffb21f; --fal-warning-weak:#fff4dd;
  --fal-success:#078c2a; --fal-success-weak:#e2fbe6;
  --fal-info:#0e9dc4;    --fal-info-weak:#e0f6fc;

  /* 明亮面 */
  --fal-surface:#ffffff;
  --fal-surface-light:#fafafa;
  --fal-surface-sunken:#f4f4f5;
  --fal-surface-hover:rgba(22,22,24,.04);
  --fal-surface-active:rgba(22,22,24,.07);
  --fal-page:#fafafa;

  --fal-content:#19191a;
  --fal-content-light:#494950;
  --fal-content-lighter:#666670;
  --fal-content-subtle:#8a8a93;
  --fal-content-inverse:#fafafa;
  --fal-ink-solid:#202022;      /* fal 的黑按钮 */

  --fal-stroke:rgba(25,25,26,.08);
  --fal-stroke-strong:rgba(25,25,26,.13);   /* 实测面板/按钮边线 */
  --fal-stroke-stronger:rgba(25,25,26,.22);

  /* 几何：fal 的识别点——4px 圆角贯穿全部控件与面板 */
  --fal-r:4px;
  --fal-r-lg:8px;
  --fal-r-xl:12px;
  --fal-r-pill:999px;

  /* 控件高度 */
  --fal-h-xs:24px; --fal-h-sm:28px; --fal-h-md:32px; --fal-h-lg:36px; --fal-h-xl:40px;

  /* 阴影：app 面几乎不用阴影，只有浮层用 */
  --fal-shadow-pop:0 0 0 1px var(--fal-stroke),0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -2px rgba(0,0,0,.05);
  --fal-shadow-over:0 0 0 1px var(--fal-stroke),0 25px 50px -12px rgba(0,0,0,.25);

  --fal-focus:0 0 0 2px var(--fal-surface),0 0 0 4px var(--fal-primary);
  --fal-t:140ms cubic-bezier(.2,0,.2,1);

  --fal-bar-h:52px;
  --fal-z-bar:40; --fal-z-drawer:60; --fal-z-modal:70; --fal-z-toast:80;
}

:root[data-theme="dark"]{
  --fal-surface:#19191a;          /* neutral-950 */
  --fal-surface-light:#202022;    /* neutral-900 */
  --fal-surface-sunken:#161618;   /* neutral-1000 */
  --fal-surface-hover:rgba(255,255,255,.05);
  --fal-surface-active:rgba(255,255,255,.08);
  --fal-page:#161618;

  --fal-content:#f4f4f5;
  --fal-content-light:#a1a1aa;
  --fal-content-lighter:#8a8a93;
  --fal-content-subtle:#666670;
  --fal-content-inverse:#19191a;
  --fal-ink-solid:#f4f4f5;

  --fal-stroke:rgba(255,255,255,.05);
  --fal-stroke-strong:rgba(255,255,255,.10);
  --fal-stroke-stronger:rgba(255,255,255,.15);

  --fal-primary:#57a8ff;           /* --info-400 hsl(211 100% 67%) */
  --fal-primary-hover:#8fc9ff;     /* --info-300 hsl(209 100% 78%) */
  --fal-primary-weak:rgba(87,168,255,.16);
  --fal-primary-ink:#a8cdff;
  --fal-navy:#0d1836;
  --fal-secondary-weak:rgba(29,203,247,.14);

  --fal-error:#ff4d7d;   --fal-error-weak:rgba(255,77,125,.15);
  --fal-warning:#ffc44d; --fal-warning-weak:rgba(255,196,77,.15);
  --fal-success:#3ddc6a; --fal-success-weak:rgba(61,220,106,.15);
  --fal-info:#3ec8ea;    --fal-info-weak:rgba(62,200,234,.15);

  --fal-shadow-pop:0 0 0 1px var(--fal-stroke),0 10px 15px -3px rgba(0,0,0,.45),0 4px 6px -2px rgba(0,0,0,.35);
  --fal-shadow-over:0 0 0 1px var(--fal-stroke),0 25px 50px -12px rgba(0,0,0,.6);
  --fal-focus:0 0 0 2px var(--fal-surface),0 0 0 4px var(--fal-primary);
}

/* ----------------------------------------------------------------- 基础 -- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--fal-page);color:var(--fal-content);
  font:400 16px/1.5 var(--fal-ui);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv11","ss01";
}
h1,h2,h3,h4,h5,p,figure{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
/* svg 不写 max-width:100%——在 grid/flex 居中容器里会把有固定尺寸的图标压成几 px。 */
svg{display:block}
:focus-visible{outline:none;box-shadow:var(--fal-focus)}
::selection{background:var(--fal-primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--fal-stroke-stronger);border-radius:var(--fal-r-pill);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--fal-content-subtle);background-clip:padding-box;border:3px solid transparent}

/* ----------------------------------------------------------------- 排版 --
   fal 的标题写法：一行内 300 与 700 并置（namespace/name），负字距随字号变大。
   ------------------------------------------------------------------------ */
.fal-display{font-family:var(--fal-display);font-weight:500;letter-spacing:-.04em;line-height:1.02}
.fal-h1{font-family:var(--fal-display);font-size:clamp(30px,4.4vw,52px);font-weight:700;letter-spacing:-.04em;line-height:1.04}
.fal-h2{font-family:var(--fal-display);font-size:24px;font-weight:600;letter-spacing:-.024em;line-height:1.16}
.fal-h3{font-family:var(--fal-display);font-size:20px;font-weight:600;letter-spacing:-.018em;line-height:1.2}
.fal-title{font-size:20px;font-weight:300;letter-spacing:-.012em;line-height:1.4}   /* 实测 h1：weight 300 */
.fal-title b,.fal-title strong{font-weight:700}
.fal-lede{font-size:16px;line-height:1.55;color:var(--fal-content-light)}
.fal-body{font-size:14px;line-height:1.6}
.fal-meta{font-size:13px;line-height:1.5;color:var(--fal-content-lighter)}
.fal-micro{font-size:12px;line-height:16px;color:var(--fal-content-lighter)}
.fal-mono{font-family:var(--fal-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fal-kicker{font-family:var(--fal-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fal-content-lighter)}
.fal-num{font-family:var(--fal-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.03em}
.fal-muted{color:var(--fal-content-lighter)}
.fal-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fal-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ----------------------------------------------------------------- 布局 -- */
.fal-shell{width:min(1440px,100% - 48px);margin-inline:auto}
.fal-stack{display:flex;flex-direction:column}
.fal-row{display:flex;align-items:center}
.fal-gap-1{gap:4px}.fal-gap-2{gap:8px}.fal-gap-3{gap:12px}.fal-gap-4{gap:16px}.fal-gap-6{gap:24px}
.fal-spacer{margin-left:auto}
.fal-grid{display:grid;gap:12px}

/* ----------------------------------------------------------------- 按钮 --
   实测：h36/h40，14px/600，字距 -.01em，左右 16px，圆角 4px，边框 1px，无阴影。
   ------------------------------------------------------------------------ */
.fal-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--fal-h-lg);padding:0 16px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);color:var(--fal-content);
  font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:20px;white-space:nowrap;
  transition:background var(--fal-t),border-color var(--fal-t),color var(--fal-t),opacity var(--fal-t);
}
.fal-btn:hover{background:var(--fal-surface-hover);border-color:var(--fal-stroke-stronger)}
.fal-btn:active{background:var(--fal-surface-active)}
.fal-btn[disabled],.fal-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.fal-btn--primary{background:var(--fal-primary);border-color:transparent;color:#fff}
.fal-btn--primary:hover{background:var(--fal-primary-hover);border-color:transparent}
.fal-btn--solid{background:var(--fal-ink-solid);border-color:transparent;color:var(--fal-content-inverse)}
.fal-btn--solid:hover{background:var(--fal-ink-solid);border-color:transparent;opacity:.88}
.fal-btn--ghost{background:transparent;border-color:transparent}
.fal-btn--ghost:hover{background:var(--fal-surface-hover);border-color:transparent}
.fal-btn--danger{color:var(--fal-error);border-color:var(--fal-stroke-strong)}
.fal-btn--danger:hover{background:var(--fal-error-weak);border-color:var(--fal-error)}
.fal-btn--xl{height:var(--fal-h-xl)}
.fal-btn--sm{height:var(--fal-h-md);padding:0 10px;font-size:13px}
.fal-btn--xs{height:var(--fal-h-sm);padding:0 8px;font-size:12px}
.fal-btn--icon{width:var(--fal-h-lg);padding:0}
.fal-btn--icon.fal-btn--sm{width:var(--fal-h-md)}
.fal-btn--icon.fal-btn--xs{width:var(--fal-h-sm)}
.fal-btn--link{height:auto;padding:0;border:0;background:none;color:var(--fal-primary-ink);
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.fal-btn--link:hover{background:none;color:var(--fal-primary)}

/* 分段控件（Preview | JSON） */
.fal-seg{display:inline-flex;padding:2px;gap:2px;background:var(--fal-surface-sunken);
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r)}
.fal-seg > button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:2px;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--fal-content-light);
  transition:background var(--fal-t),color var(--fal-t)}
.fal-seg > button:hover{color:var(--fal-content)}
.fal-seg > button[aria-pressed="true"],.fal-seg > button.is-on{background:var(--fal-surface);color:var(--fal-content);box-shadow:0 0 0 1px var(--fal-stroke)}

/* ------------------------------------------------------------- 面板/卡片 --
   实测：1px 边线 + 4px 圆角 + 无阴影，靠边线分层，不靠投影。
   ------------------------------------------------------------------------ */
.fal-panel{background:var(--fal-surface);border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);min-width:0}
.fal-panel__head{display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 16px;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-panel__title{font-size:16px;font-weight:600;letter-spacing:-.016em}
.fal-panel__body{padding:16px}
.fal-panel__body--flush{padding:0}
.fal-panel__foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--fal-stroke-strong)}

.fal-card{display:block;background:var(--fal-surface);border:1px solid var(--fal-stroke-strong);
  border-radius:var(--fal-r);overflow:hidden;transition:border-color var(--fal-t),background var(--fal-t)}
a.fal-card:hover,button.fal-card:hover{border-color:var(--fal-stroke-stronger);background:var(--fal-surface-light)}
.fal-card__media{aspect-ratio:1/1;background:var(--fal-surface-sunken);overflow:hidden}
.fal-card__media img{width:100%;height:100%;object-fit:cover}
.fal-card__body{padding:12px 14px}

/* ------------------------------------------------------------------ 标签 --
   fal 的 chip 不填色：小图标 + 彩色文字；徽章才填 5% 底。
   ------------------------------------------------------------------------ */
.fal-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;letter-spacing:-.01em;
  line-height:16px;color:var(--fal-content-lighter);white-space:nowrap}
.fal-chip .fal-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.fal-chip--primary{color:var(--fal-primary-ink)}
.fal-chip--success{color:var(--fal-success)}
.fal-chip--info{color:var(--fal-info)}
.fal-chip--warning{color:#a86400}
.fal-chip--error{color:var(--fal-error)}

.fal-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;
  border:1px solid transparent;border-radius:var(--fal-r);
  background:var(--fal-surface-active);color:var(--fal-content-light);
  font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:16px;white-space:nowrap}
.fal-badge--primary{background:var(--fal-primary-weak);color:var(--fal-primary-ink)}
.fal-badge--success{background:var(--fal-success-weak);color:var(--fal-success)}
.fal-badge--warning{background:var(--fal-warning-weak);color:#a86400}
.fal-badge--error{background:var(--fal-error-weak);color:var(--fal-error)}
.fal-badge--info{background:var(--fal-info-weak);color:var(--fal-info)}
.fal-badge--outline{background:transparent;border-color:var(--fal-stroke-strong)}

/* ------------------------------------------------------------------ 标签页 --
   实测：h40，16px/500，2px 下边线，激活主色。
   ------------------------------------------------------------------------ */
.fal-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-tabs::-webkit-scrollbar{display:none}
.fal-tab{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:var(--fal-h-xl);padding:0 16px;flex:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  font-size:16px;font-weight:500;letter-spacing:-.012em;color:var(--fal-content-light);white-space:nowrap;
  transition:color var(--fal-t),border-color var(--fal-t)}
.fal-tab:hover{color:var(--fal-content)}
.fal-tab[aria-current="page"],.fal-tab[aria-selected="true"]{color:var(--fal-content);border-bottom-color:var(--fal-primary)}

/* ----------------------------------------------------------------- 表单 -- */
.fal-field{display:flex;align-items:center;width:100%;height:var(--fal-h-lg);padding:0 10px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);font-size:14px;letter-spacing:-.01em;
  transition:border-color var(--fal-t),box-shadow var(--fal-t)}
textarea.fal-field{height:auto;min-height:88px;padding:8px 10px;line-height:1.55;resize:vertical}
select.fal-field{appearance:none;padding-right:28px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fal-field:hover{border-color:var(--fal-stroke-stronger)}
.fal-field:focus,.fal-field:focus-visible{outline:none;border-color:var(--fal-primary);box-shadow:0 0 0 3px var(--fal-primary-weak)}
.fal-field::placeholder{color:var(--fal-content-subtle)}
.fal-label{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.fal-hint{font-size:12px;color:var(--fal-content-lighter);margin-top:5px}
.fal-search{position:relative}
.fal-search .fal-field{padding-left:32px}
.fal-search > svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--fal-content-subtle)}

/* ----------------------------------------------------------------- 表格 -- */
.fal-tablewrap{overflow-x:auto;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface)}
.fal-table{width:100%;border-collapse:collapse;font-size:14px}
.fal-table th{position:sticky;top:0;z-index:1;background:var(--fal-surface-light);
  text-align:left;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--fal-content-lighter);
  padding:8px 12px;border-bottom:1px solid var(--fal-stroke-strong);white-space:nowrap}
.fal-table td{padding:9px 12px;border-bottom:1px solid var(--fal-stroke);vertical-align:middle}
.fal-table tbody tr:last-child td{border-bottom:0}
.fal-table tbody tr:hover{background:var(--fal-surface-hover)}
.fal-table th[aria-sort]{cursor:pointer;user-select:none}
.fal-table th[aria-sort]:hover{color:var(--fal-content)}

/* ----------------------------------------------------------------- 进度 -- */
.fal-meter{height:4px;border-radius:var(--fal-r-pill);background:var(--fal-surface-active);overflow:hidden}
.fal-meter > i{display:block;height:100%;border-radius:inherit;background:var(--fal-primary);transition:width 240ms cubic-bezier(.2,0,.2,1)}
.fal-meter--lime > i{background:var(--fal-secondary)}

/* ------------------------------------------------------------ 抽屉/弹窗 -- */
.fal-scrim{position:fixed;inset:0;z-index:var(--fal-z-drawer);background:rgba(22,22,24,.5);opacity:0;pointer-events:none;transition:opacity var(--fal-t)}
.fal-scrim.is-open{opacity:1;pointer-events:auto}
.fal-drawer{position:fixed;top:0;right:0;bottom:0;z-index:calc(var(--fal-z-drawer) + 1);
  width:min(560px,100%);display:flex;flex-direction:column;
  background:var(--fal-surface);border-left:1px solid var(--fal-stroke-strong);
  transform:translateX(100%);transition:transform 200ms cubic-bezier(.2,0,.2,1)}
.fal-drawer.is-open{transform:none}
.fal-drawer__head{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--fal-stroke-strong)}
.fal-drawer__body{flex:1;overflow-y:auto;padding:16px}
.fal-drawer__foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--fal-stroke-strong);background:var(--fal-surface)}

.fal-modal{position:fixed;inset:0;z-index:var(--fal-z-modal);display:grid;place-items:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity var(--fal-t)}
.fal-modal.is-open{opacity:1;pointer-events:auto}
.fal-modal__panel{width:min(460px,100%);background:var(--fal-surface);border-radius:var(--fal-r-lg);
  box-shadow:var(--fal-shadow-over);transform:translateY(6px);transition:transform 200ms cubic-bezier(.2,0,.2,1)}
.fal-modal.is-open .fal-modal__panel{transform:none}

/* ----------------------------------------------------------------- 顶栏 -- */
.fal-bar{position:sticky;top:0;z-index:var(--fal-z-bar);background:var(--fal-surface);border-bottom:1px solid var(--fal-stroke-strong)}
.fal-bar__in{display:flex;align-items:center;gap:12px;min-height:var(--fal-bar-h);padding:8px 0}

/* --------------------------------------------------------------- 空状态 -- */
.fal-empty{padding:40px 20px;text-align:center;color:var(--fal-content-lighter);font-size:14px}
.fal-empty strong{display:block;color:var(--fal-content);font-size:15px;font-weight:600;margin-bottom:6px}

/* ------------------------------------------------------------- 海报区块 --
   fal 官网营销面：高彩平涂底 + 超大黑字 + 图形块。只用于页头，不进工作区。
   ------------------------------------------------------------------------ */
.fal-poster{position:relative;overflow:hidden;background:var(--fal-poster-cyan);color:#000;border-radius:var(--fal-r-lg)}
.fal-poster--violet{background:var(--fal-poster-violet);color:#fff}
.fal-poster--lime{background:var(--fal-poster-lime);color:#000}
.fal-poster__in{position:relative;z-index:1;padding:clamp(20px,3.4vw,40px)}

/* --------------------------------------------------------------- 动效 -- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* --------------------------------------------------------------- 响应 -- */
@media (max-width:860px){
  :root{--fal-h-md:34px;--fal-h-lg:40px;--fal-h-xl:44px}
  .fal-shell{width:min(1440px,100% - 32px)}
  .fal-btn{font-size:14px}
  .fal-tab{font-size:15px;padding:0 12px}
  .fal-panel__body{padding:14px}
  .fal-drawer{top:auto;left:0;width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--fal-stroke-strong);
    border-radius:var(--fal-r-xl) var(--fal-r-xl) 0 0;transform:translateY(100%)}
}


/* ============================================================================
   页面业务样式 · 只用 --fal-* token，不自定义颜色
   ========================================================================= */

.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.icon--sm{width:14px;height:14px}

.mark{width:28px;height:28px;border-radius:var(--fal-r);background:var(--fal-primary);color:#fff;
  display:grid;place-items:center;font:700 11px/1 var(--fal-mono);letter-spacing:.04em;flex:none}

.app{padding:16px 0 48px}
.view{display:none}
.view.is-active{display:block}

/* ------------------------------------------------------------------ 工具条 -- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
/* 组内也要能换行并允许 select 收缩，否则窄屏下 width:auto 的 select 会把后面的按钮顶出视口 */
.toolbar__group{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;max-width:100%}
/* 高度走 CSS 不写 inline，否则媒体查询里抬不动触摸目标 */
.pathsel{width:auto;height:var(--fal-h-md);min-width:0;flex:1 1 108px}

/* 关系类型开关：不填色的 chip，靠色点和边线表达开关态 */
.typebar{display:flex;flex-wrap:wrap;gap:4px}
.typetog{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface);
  font-size:12px;font-weight:600;letter-spacing:-.01em;color:var(--fal-content-subtle);
  transition:color var(--fal-t),border-color var(--fal-t),background var(--fal-t)}
.typetog:hover{border-color:var(--fal-stroke-stronger)}
.typetog[aria-pressed="true"]{color:var(--fal-content);border-color:var(--fal-stroke-stronger)}
.typetog i{width:14px;height:0;border-top:2px solid currentColor;opacity:.35;flex:none}
.typetog[aria-pressed="true"] i{opacity:1}
/* 与 JS 的 TYPE_COLOR 保持一致：主轴走蓝—青，紫色只留给 creator 做点缀 */
.typetog[data-t="kin"]{--c:#e0761a}     .typetog[data-t="romance"]{--c:#e0407a}
.typetog[data-t="mentor"]{--c:#115ef3}  .typetog[data-t="ally"]{--c:#078c2a}
.typetog[data-t="rival"]{--c:#c98a00}   .typetog[data-t="enemy"]{--c:#f00550}
.typetog[data-t="legacy"]{--c:#0e9dc4}  .typetog[data-t="creator"]{--c:#7630f8}
.typetog[data-t="affiliation"]{--c:#8a8a93}
.typetog[aria-pressed="true"] i{border-color:var(--c)}

/* ------------------------------------------------------------- 时间游标 -- */
.cursor{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:10px;
  border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);background:var(--fal-surface)}
.cursor__meta{min-width:0;flex:1}
.cursor__name{font-size:14px;font-weight:600;letter-spacing:-.012em}
.cursor__sum{font-size:12px;line-height:1.45;color:var(--fal-content-lighter);margin-top:2px}
.cursor__num{font-family:var(--fal-mono);font-size:12px;font-weight:600;color:var(--fal-content-lighter);
  font-variant-numeric:tabular-nums;flex:none}
.cursor input[type=range]{flex:2;min-width:140px;accent-color:var(--fal-primary);height:20px}

/* ------------------------------------------------------------------- 图 -- */
.canvas{position:relative;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);overflow:hidden;touch-action:none}
.canvas svg{width:100%;height:clamp(520px,74vh,860px);display:block;cursor:grab}
.canvas svg.is-panning{cursor:grabbing}
.canvas__hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--fal-content-subtle);
  pointer-events:none;font-family:var(--fal-mono);letter-spacing:-.01em}
.canvas__zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}

.lnk{stroke-width:1.4;fill:none;transition:opacity var(--fal-t)}
.lnk.is-inferred{stroke-dasharray:3 3}
.lnk.is-dim{opacity:.06}
.lnk.is-hot{stroke-width:2.6}
.node{cursor:pointer}
.node .n-box{fill:var(--fal-surface);stroke:var(--fal-stroke-stronger);stroke-width:1;
  transition:fill var(--fal-t),stroke var(--fal-t)}
.node:hover .n-box{fill:var(--fal-primary-weak);stroke:var(--fal-primary)}
.node.is-sel .n-box{fill:var(--fal-primary-weak);stroke:var(--fal-primary);stroke-width:2}
.node.is-org .n-box{stroke-dasharray:4 3}
.node .n-t{font-size:11px;font-weight:600;letter-spacing:-.015em;fill:var(--fal-content);
  pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.node .n-acc{stroke-width:3;stroke-linecap:round}
.node.is-dead .n-box{fill:var(--fal-surface-sunken)}
.node.is-dead .n-t{fill:var(--fal-content-subtle)}
.node.is-dim{opacity:.14}
.node .n-pin{fill:var(--fal-primary);stroke:none}
.axis-l{stroke:var(--fal-stroke-strong);stroke-width:1;stroke-dasharray:2 4}
.axis-t{font-size:11px;font-weight:700;letter-spacing:.02em;fill:var(--fal-content-lighter);
  text-anchor:middle;pointer-events:none}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fal-content-lighter)}
.legend b{width:8px;height:8px;border-radius:2px;flex:none}

/* ------------------------------------------------------------------ 人物 -- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pcard{text-align:left;padding:11px 12px;display:flex;flex-direction:column;gap:6px;
  border-left:3px solid var(--tone,var(--fal-stroke-stronger))}
.pcard__top{display:flex;align-items:baseline;gap:6px;min-width:0}
.pcard__name{font-size:14.5px;font-weight:700;letter-spacing:-.014em}
.pcard__alias{font-size:12px;color:var(--fal-content-lighter);min-width:0}
.pcard__roles{display:flex;flex-wrap:wrap;gap:4px}
.pcard__foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fal-content-subtle);
  font-family:var(--fal-mono);letter-spacing:-.02em;flex-wrap:wrap}
/* 三段元信息都以数字结尾，只靠间距会连读成一串，必须给分隔符 */
.pcard__foot > span + span::before{content:"·";margin-right:6px;opacity:.55}

/* -------------------------------------------------------------- 叙事结构 -- */
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.rank{display:flex;flex-direction:column}
.rank__row{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid var(--fal-stroke)}
.rank__row:last-child{border-bottom:0}
.rank__i{font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle);text-align:right}
.rank__bar{height:4px;border-radius:var(--fal-r-pill);background:var(--fal-surface-active);overflow:hidden;margin-top:4px}
.rank__bar i{display:block;height:100%;background:var(--fal-primary)}
.rank__v{font-family:var(--fal-mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rolegrid{display:flex;flex-direction:column;gap:10px}
.rolegrid__h{display:flex;align-items:baseline;gap:8px}
.rolegrid__n{font-size:13.5px;font-weight:700;letter-spacing:-.012em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chipbtn{height:22px;padding:0 7px;border:1px solid var(--fal-stroke-strong);border-radius:var(--fal-r);
  background:var(--fal-surface);font-size:12px;font-weight:500;letter-spacing:-.01em;color:var(--fal-content-light)}
.chipbtn:hover{border-color:var(--fal-primary);color:var(--fal-primary-ink)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;
  border-bottom:1px solid var(--fal-stroke);font-size:13px}
.chain:last-child{border-bottom:0}
.chain svg{color:var(--fal-content-subtle)}

/* ------------------------------------------------------------------ 抽屉 -- */
.dr-t{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.dr-sec{margin-top:18px}
.dr-sec:first-child{margin-top:0}
.dr-h{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--fal-mono);color:var(--fal-content-lighter);margin-bottom:8px}
.arc{display:flex;flex-direction:column;gap:0}
.arc__row{display:grid;grid-template-columns:8px 1fr;gap:10px;padding-bottom:12px;position:relative}
.arc__row::before{content:"";position:absolute;left:3px;top:12px;bottom:0;width:1px;background:var(--fal-stroke-strong)}
.arc__row:last-child::before{display:none}
.arc__dot{width:8px;height:8px;border-radius:50%;background:var(--fal-primary);margin-top:5px;z-index:1}
.arc__row.is-dead .arc__dot{background:var(--fal-content-subtle)}
.arc__ph{font-size:13px;font-weight:600;letter-spacing:-.012em}
.arc__n{font-size:12.5px;line-height:1.5;color:var(--fal-content-lighter);margin-top:1px}
.rel{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--fal-stroke)}
.rel:last-child{border-bottom:0}
.rel__t{width:34px;flex:none;font-size:11px;font-weight:600;font-family:var(--fal-mono);
  color:var(--rc,var(--fal-content-subtle));padding-top:2px}
.rel__b{min-width:0;flex:1}
.rel__n{font-size:12px;line-height:1.5;color:var(--fal-content-lighter)}
.worklist{display:flex;flex-direction:column;gap:2px}
.workrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;
  font-size:13px;padding:4px 0;border-bottom:1px solid var(--fal-stroke)}
.workrow:last-child{border-bottom:0}
.workrow__id{font-family:var(--fal-mono);font-size:11px;color:var(--fal-content-subtle)}
.workrow__y{font-family:var(--fal-mono);font-size:11.5px;color:var(--fal-content-lighter)}

/* ---------------------------------------------------------------- 响应 -- */
/* 窄屏顶栏：标题优先。默认 flex 布局下右侧按钮会把 min-width:0 的标题压成 0 宽，
   实测 390px 时标题整条消失，所以按次要程度依次让位。 */
@media (max-width:720px){
  #pageTitle{flex:1 1 auto;font-size:17px}
  #pageTitle .ns{display:none}
  #stateBadge{display:none}
  .fal-bar__in .fal-btn span:not(.fal-sr){display:none}
  .fal-bar__in .fal-btn{padding:0 10px}
}

@media (max-width:860px){
  .canvas svg{height:clamp(420px,64vh,600px)}
  .cursor{flex-wrap:wrap}
  .cursor__meta{order:3;flex-basis:100%}
  .people{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  /* 触摸目标不低于 40px。fal.css 把 --fal-h-md 定在 34px，对次要按钮偏小，
     这里只在本页抬高，不动共享系统。 */

const EVENTS = G.events.slice().sort((a, b) => a.seq - b.seq);
const MAXSEQ = EVENTS[EVENTS.length - 1].seq;

/* ================================================================= 时间 == */
let cursorSeq = MAXSEQ, ignoreTime = false;

function phaseSeqAt(seq) { return PH[EVENTS.find(e => e.seq === seq).phase].seq; }

/** 角色在当前游标下的状态：{appeared, alive, faction, stance, note} */
function stateOf(c) {
  if (ignoreTime) {
    const a = c.arc[c.arc.length - 1];
    return { appeared: true, alive: true, faction: a.faction, stance: a.stance, note: a.note };
  }
  const ps = phaseSeqAt(cursorSeq);
  let cur = null;
  for (const a of c.arc) { if (PH[a.phase].seq <= ps) cur = a; }
  if (!cur) return { appeared: false };
  return { appeared: true, alive: cur.alive !== false, faction: cur.faction, stance: cur.stance, note: cur.note };
}

function relVisible(r) {
  if (!typeOn[r.type]) return false;
  if (!ignoreTime) {
    if (r.from_event && EV[r.from_event].seq > cursorSeq) return false;
    if (r.to_event && EV[r.to_event].seq <= cursorSeq) return false;
  }
  return true;
}

const typeOn = {};
G.relations_meta.forEach(m => typeOn[m.type] = m.default_on);

/* ================================================================ 力导向 == */
/* 60 节点规模下 O(n²) 斥力约 3600 次/tick，60fps 足够，不需要 Barnes-Hut。 */
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

let W = 1000, H = 600;
let layout = "faction";
let nodes = [], links = [];
let alpha = 1, ticking = false, rafId = 0;
let view = { k: 1, x: 0, y: 0 };
let selected = null, hovered = null, pathSet = null;
let axis = [];                          // 列布局的表头：[{x, t}]
const AXIS_H = 26;                      // 顶部让出给列标题的高度

const NW = 72, NH = 22;                 // 节点矩形尺寸
const PADX = 14, PADY = 12;             // 碰撞分离时节点之间的最小空隙
let padY = PADY;                        // 列布局下按最挤的一列自适应压缩
/* 弹簧静止长度按关系类型区分：血缘/情感最近，敌对最远 */
const SPRING = { kin:110, romance:110, mentor:140, ally:155, rival:185, enemy:210, legacy:140, creator:140, affiliation:170 };
/* 斥力系数：要让 f_rep = REP/d² 在目标间距（约 150px）上压得住弹簧，
   REP 必须是 150² 量级。初版给 5200 导致弹簧强出 20 倍，整张图塌成一团。 */
const REPULSE = 30000;
const SPRING_K = 0.018, SPRING_MAX = 6;

/* 每个角色一个持久的物理体，切布局不重建，保持连续感 */
const BODY = {};
G.characters.forEach(c => { BODY[c.id] = { id:c.id, x:0, y:0, vx:0, vy:0, fx:null, fy:null }; });

/** 用黄金角螺旋铺满画布，比同心圆起手收敛快很多 */
function scatter() {
  const n = G.characters.length, GA = Math.PI * (3 - Math.sqrt(5));
  G.characters.forEach((c, i) => {
    const b = BODY[c.id], t = Math.sqrt((i + 0.5) / n), a = i * GA;
    b.fx = b.fy = null; b.vx = b.vy = 0;
    b.x = W / 2 + Math.cos(a) * t * (W / 2 - 60);
    b.y = H / 2 + Math.sin(a) * t * (H / 2 - 40);
  });
}

/** 阵营簇心：按出现的阵营均匀排在椭圆上 */
function factionCenters(used) {
  const out = {}, n = used.length;
  used.forEach((f, i) => {
    const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
    out[f] = { x: W / 2 + Math.cos(ang) * W * 0.30, y: H / 2 + Math.sin(ang) * H * 0.32 };
  });
  return out;
}

/** 计算当前可见的节点与连线 */
function computeGraph() {
  const st = {};
  const vis = [];
  for (const c of G.characters) {
    const s = stateOf(c);
    if (!s.appeared) continue;
    st[c.id] = s; vis.push(c.id);
  }
  const visSet = new Set(vis);
  links = G.relations
    .filter(r => relVisible(r) && visSet.has(r.source) && visSet.has(r.target))
    .map(r => ({ r, a: BODY[r.source], b: BODY[r.target] }));

  const linked = new Set();
  links.forEach(l => { linked.add(l.r.source); linked.add(l.r.target); });

  nodes = vis.map(id => {
    const b = BODY[id];
    b.st = st[id]; b.c = CH[id]; b.iso = !linked.has(id);
    return b;
  });

  // 布局锁定
  const used = [...new Set(nodes.map(n => n.st.faction))];
  const centers = factionCenters(used);

  /* 只给「真的有人」的阶段/功能分列，否则空列会白占画布
     （六个阶段里其实只有前四个有角色首次登场，不筛掉就浪费三分之一宽度）。 */
  const keyOf = n => layout === "timeline" ? n.c.arc[0].phase : n.c.narrative_role[0];
  const order = layout === "timeline" ? G.phases.map(p => p.id) : G.roles.map(r => r.id);
  const label = layout === "timeline"
    ? id => PH[id].short
    : id => ROLE[id].name;
  const present = order.filter(id => nodes.some(n => keyOf(n) === id));
  const colX = {};
  present.forEach((id, i) => colX[id] = (i + 0.5) / present.length * W);
  axis = layout === "faction" ? [] : present.map(id => ({ x: colX[id], t: label(id) }));

  /* 最挤的一列决定纵向间距：列布局下高度是硬约束，塞不下就把间距压到刚好放得下，
     否则最长的那列会在底部溢出或重叠。 */
  if (layout === "faction") {
    padY = PADY;
  } else {
    const most = Math.max(...present.map(id => nodes.filter(n => keyOf(n) === id).length), 1);
    const usable = H - AXIS_H - NH - 12;
    padY = Math.max(3, Math.min(PADY, usable / Math.max(most - 1, 1) - NH));
  }

  nodes.forEach(n => {
    n.cx = centers[n.st.faction] || { x: W / 2, y: H / 2 };
    n.lockX = layout === "faction" ? null : (colX[keyOf(n)] ?? W / 2);
  });
}

function tick() {
  const n = nodes.length;
  if (!n) return;
  const REP = layout === "faction" ? REPULSE : REPULSE * 0.75;

  // --- 斥力（O(n²)，60 节点约 1770 对，60fps 绰绰有余）---
  for (let i = 0; i < n; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < n; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2);
      const f = Math.min(REP / d2, 40);          // 封顶，避免近距离数值爆炸
      const ux = dx / d * f, uy = dy / d * f;
      a.vx -= ux; a.vy -= uy; b.vx += ux; b.vy += uy;
    }
  }

  // --- 弹簧 ---
  for (const l of links) {
    const rest = SPRING[l.r.type] || 150;
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || 1;
    let f = (d - rest) * SPRING_K;
    f = Math.max(-SPRING_MAX, Math.min(SPRING_MAX, f));
    const ux = dx / d * f, uy = dy / d * f;
    l.a.vx += ux; l.a.vy += uy; l.b.vx -= ux; l.b.vy -= uy;
  }

  // --- 布局约束 + 积分 ---
  for (const p of nodes) {
    if (layout === "faction") {                 // 阵营向心：要强到真的能看出分组
      p.vx += (p.cx.x - p.x) * 0.022;
      p.vy += (p.cx.y - p.y) * 0.022;
    } else {                                     // 列布局：y 自由，x 见下方硬锁
      p.vy += (H / 2 - p.y) * 0.004;
    }
    p.vx *= 0.82; p.vy *= 0.82;
    if (p.fx !== null) { p.x = p.fx; p.y = p.fy; p.vx = p.vy = 0; continue; }
    p.x += p.vx * alpha; p.y += p.vy * alpha;
    /* x 用弹簧拉不住斥力（60 节点挤一列时斥力远大于回复力，实测散成 19 列而不是 6 列），
       列布局直接把 x 钉死，只让 y 参与力学。 */
    if (layout !== "faction") { p.x = p.lockX; p.vx = 0; }
  }

  /* 列布局的 y 其实是一维装箱，不该用通用碰撞去凑——力学会一直把节点往回拉，
     分离只能收敛到「差几像素」（实测残留 2 处、最多重叠 9px）。改用确定性扫描排布。
     顺序要求：必须以 clampAll 收尾，否则节点会被顶进表头区盖住列标题。 */
  if (layout === "faction") { separate(); clampAll(); separate(); }
  else packColumns();
  clampAll();
  alpha *= 0.99;
}

function bounds() {
  const mx = NW / 2 + 4, my = NH / 2 + 4;
  return { mx, my, top: my + (axis.length ? AXIS_H : 0), bottom: H - my };
}

/** 矩形碰撞分离：标签是方框，只靠斥力压不住重叠，必须显式推开。
    沿重叠更少的那个轴推，两个节点各让一半——**除非一方已经抵住边界**，
    那时它让出的一半会被 clampAll 推回来，形成推不开的僵局（实测两个节点会完全重合），
    所以要把位移整份给还能动的那个。 */
function separate() {
  const n = nodes.length;
  const B = bounds();
  const freeY = p => p.fx === null;
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < n; j++) {
        const b = nodes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const ox = (NW + PADX) - Math.abs(dx);   // x 方向重叠量
        const oy = (NH + padY) - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        const lockedX = layout !== "faction";     // 列布局下不要横向推，会破坏分列
        if (!lockedX && ox < oy) {
          const dir = dx === 0 ? 1 : Math.sign(dx);
          const aFree = a.fx === null, bFree = b.fx === null;
          const half = ox / (aFree && bFree ? 2 : 1);
          if (aFree) a.x -= dir * half;
          if (bFree) b.x += dir * half;
        } else {
          const dir = dy === 0 ? (a.y <= B.top ? 1 : -1) : Math.sign(dy);
          // 上/下各自是否还有空间可让
          const up = dir > 0 ? a : b, down = dir > 0 ? b : a;
          const upCan = freeY(up) && up.y > B.top;
          const downCan = freeY(down) && down.y < B.bottom;
          if (upCan && downCan) { up.y -= oy / 2; down.y += oy / 2; }
          else if (downCan) down.y += oy;         // 上面那个抵住表头了，全让下面的走
          else if (upCan) up.y -= oy;
        }
      }
    }
  }
}

/** 列布局专用：把每一列当成一维装箱，按当前 y 排序后单向扫描铺开，
    超出底部再从下往上回推。力学只决定「谁在上谁在下」，间距由这里保证。
    被用户拖住的节点（fx 非空）不参与，它的位置以用户为准。 */
function packColumns() {
  const B = bounds(), gap = NH + padY, groups = new Map();
  for (const p of nodes) {
    if (p.fx !== null) continue;
    const k = Math.round(p.lockX);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  for (const col of groups.values()) {
    col.sort((a, b) => a.y - b.y);
    let y = B.top;
    for (const p of col) { p.y = Math.max(p.y, y); y = p.y + gap; }
    const last = col[col.length - 1];
    if (last && last.y > B.bottom) {           // 撑破底部，从下往上回推
      let yy = B.bottom;
      for (let i = col.length - 1; i >= 0; i--) { col[i].y = Math.min(col[i].y, yy); yy = col[i].y - gap; }
    }
  }
}

function clampAll() {
  const B = bounds();
  for (const p of nodes) {
    if (p.fx !== null) continue;
    p.x = Math.max(B.mx, Math.min(W - B.mx, p.x));
    p.y = Math.max(B.top, Math.min(B.bottom, p.y));
  }
}

function loop() {
  tick(); paint();
  if (alpha > 0.03) { rafId = requestAnimationFrame(loop); }
  else { ticking = false; }
}
function kick(a) {
  alpha = Math.max(alpha, a ?? 0.9);
  if (!ticking) { ticking = true; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
}

/* -------------------------------------------------------------- 绘制 -- */
let gRoot = null, gLinks = null, gNodes = null, gAxis = null;
function ensureLayers() {
  if (gRoot && gRoot.isConnected) return;
  svg.textContent = "";
  gRoot = mk("g", {}); gAxis = mk("g", {}); gLinks = mk("g", {}); gNodes = mk("g", {});
  gRoot.append(gAxis, gLinks, gNodes); svg.append(gRoot);
}

function paint() {
  ensureLayers();
  gRoot.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);

  // ---- 列表头（时间轴 / 叙事功能模式）----
  while (gAxis.childNodes.length > axis.length * 2) gAxis.lastChild.remove();
  while (gAxis.childNodes.length < axis.length * 2) {
    gAxis.append(mk("line", { class:"axis-l" }), mk("text", { class:"axis-t" }));
  }
  axis.forEach((a, i) => {
    const line = gAxis.childNodes[i * 2], text = gAxis.childNodes[i * 2 + 1];
    const bx = i === 0 ? 0 : (a.x + axis[i - 1].x) / 2;   // 分隔线画在两列中点
    line.setAttribute("x1", bx); line.setAttribute("x2", bx);
    line.setAttribute("y1", AXIS_H - 8); line.setAttribute("y2", H);
    line.setAttribute("opacity", i === 0 ? 0 : 1);
    text.setAttribute("x", a.x); text.setAttribute("y", 14);
    text.textContent = a.t;
  });

  const hotSet = pathSet || (hovered ? new Set([hovered, ...ADJ[hovered]]) : null);

  // ---- 连线 ----
  while (gLinks.childNodes.length > links.length) gLinks.lastChild.remove();
  while (gLinks.childNodes.length < links.length) gLinks.append(mk("path", { class:"lnk" }));
  links.forEach((l, i) => {
    const el = gLinks.childNodes[i];
    el.setAttribute("d", `M${l.a.x} ${l.a.y}L${l.b.x} ${l.b.y}`);
    el.setAttribute("stroke", TYPE_COLOR[l.r.type]);
    let cls = "lnk" + (l.r.confidence === "inferred" ? " is-inferred" : "");
    if (hotSet) {
      const on = hotSet.has(l.r.source) && hotSet.has(l.r.target);
      cls += on ? " is-hot" : " is-dim";
    }
    el.setAttribute("class", cls);
    el.setAttribute("opacity", l.r.type === "affiliation" ? .5 : .78);
  });

  // ---- 节点 ----
  while (gNodes.childNodes.length > nodes.length) gNodes.lastChild.remove();
  while (gNodes.childNodes.length < nodes.length) {
    const g = mk("g", { class:"node", tabindex:"0", role:"button" });
    g.append(
      mk("rect", { class:"n-box", width:NW, height:NH, rx:4 }),
      mk("line", { class:"n-acc" }),
      mk("text", { class:"n-t" }),
      mk("circle", { class:"n-pin", r:2.5 })
    );
    gNodes.append(g);
  }
  nodes.forEach((p, i) => {
    const g = gNodes.childNodes[i];
    const [rect, acc, text, pin] = g.childNodes;
    g.setAttribute("transform", `translate(${p.x - NW / 2},${p.y - NH / 2})`);
    let cls = "node";
    if (p.c.kind === "org") cls += " is-org";
    if (!p.st.alive) cls += " is-dead";
    if (selected === p.id) cls += " is-sel";
    if (hotSet && !hotSet.has(p.id)) cls += " is-dim";
    g.setAttribute("class", cls);
    g.dataset.id = p.id;
    rect.setAttribute("width", NW); rect.setAttribute("height", NH);
    acc.setAttribute("x1", 1.5); acc.setAttribute("y1", 5);
    acc.setAttribute("x2", 1.5); acc.setAttribute("y2", NH - 5);
    acc.setAttribute("stroke", stanceColor(p.st.stance));
    text.setAttribute("x", NW / 2 + 2); text.setAttribute("y", NH / 2 + 1);
    text.textContent = fit(p.c.name, 6);
    pin.setAttribute("cx", NW - 5); pin.setAttribute("cy", 5);
    pin.setAttribute("opacity", p.fx !== null ? 1 : 0);
    let title = g.querySelector("title");
    if (!title) { title = mk("title", {}); g.append(title); }
    title.textContent = `${p.c.name}${p.c.alias ? "（" + p.c.alias + "）" : ""} · ${FAC[p.st.faction]?.name || ""}`;
  });

  document.getElementById("hint").textContent =
    `${nodes.length} 人 · ${links.length} 条关系 · ${Math.round(view.k * 100)}%`;
}
function stanceColor(s) {
  return s === "antagonist" ? TYPE_COLOR.enemy
    : s === "rival" ? TYPE_COLOR.rival
    : s === "protagonist" ? TYPE_COLOR.mentor
    : s === "neutral" ? TYPE_COLOR.affiliation : TYPE_COLOR.ally;
}
function fit(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

/* --------------------------------------------------------- 交互：图 -- */
function resize() {
  const r = svg.getBoundingClientRect();
  W = Math.max(320, r.width); H = Math.max(320, r.height);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
}

let drag = null, panning = null, moved = false;
function toLocal(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k };
}
svg.addEventListener("pointerdown", ev => {
  const g = ev.target.closest(".node");
  moved = false;
  if (g) {
    const p = BODY[g.dataset.id];
    const l = toLocal(ev);
    drag = { p, dx: p.x - l.x, dy: p.y - l.y };
    svg.setPointerCapture(ev.pointerId);
  } else {
    panning = { x: ev.clientX - view.x, y: ev.clientY - view.y };
    svg.classList.add("is-panning");
    svg.setPointerCapture(ev.pointerId);
  }
});
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const l = toLocal(ev);
    drag.p.fx = l.x + drag.dx; drag.p.fy = l.y + drag.dy;
    drag.p.x = drag.p.fx; drag.p.y = drag.p.fy;
    moved = true; kick(0.35);
  } else if (panning) {
    view.x = ev.clientX - panning.x; view.y = ev.clientY - panning.y;
    moved = true; paint();
  } else {
    const g = ev.target.closest(".node");
    const id = g ? g.dataset.id : null;
    if (id !== hovered) { hovered = id; if (!ticking) paint(); }
  }
});
function endPointer(ev) {
  if (drag && !moved) { openDrawer(drag.p.id); }
  drag = null; panning = null; svg.classList.remove("is-panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("pointerleave", () => { if (hovered) { hovered = null; if (!ticking) paint(); } });
svg.addEventListener("dblclick", ev => {
  const g = ev.target.closest(".node");
  if (g) { const p = BODY[g.dataset.id]; p.fx = p.fy = null; kick(0.6); }
});
svg.addEventListener("keydown", ev => {
  const g = ev.target.closest(".node");
  if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openDrawer(g.dataset.id); }
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k2 = Math.max(0.35, Math.min(2.6, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2; paint();
}, { passive: false });

function zoomBy(f) {
  const k2 = Math.max(0.35, Math.min(2.6, view.k * f));
  view.x = W / 2 - (W / 2 - view.x) * (k2 / view.k);
  view.y = H / 2 - (H / 2 - view.y) * (k2 / view.k);
  view.k = k2; paint();
}
document.getElementById("zIn").onclick = () => zoomBy(1.2);
document.getElementById("zOut").onclick = () => zoomBy(1 / 1.2);
document.getElementById("zFit").onclick = () => { view = { k:1, x:0, y:0 }; paint(); };
document.getElementById("resetBtn").onclick = () => {
  scatter();
  view = { k:1, x:0, y:0 }; pathSet = null; rebuild(1);
};

document.querySelectorAll("[data-layout]").forEach(b => b.onclick = () => {
  layout = b.dataset.layout;
  document.querySelectorAll("[data-layout]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  G.characters.forEach(c => { BODY[c.id].fx = BODY[c.id].fy = null; });
  rebuild(1);
});

document.getElementById("gq").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { pathSet = null; paint(); return; }
  const hit = G.characters.filter(c =>
    c.name.toLowerCase().includes(q) || (c.alias || "").toLowerCase().includes(q));
  pathSet = hit.length ? new Set(hit.map(c => c.id)) : null;
  paint();
});

/* 最短路径：BFS（无权图） */
function shortestPath(a, b) {
  if (a === b) return [a];
  const prev = { [a]: null }, q = [a];
  while (q.length) {
    const cur = q.shift();
    for (const nx of ADJ[cur]) {
      if (nx in prev) continue;
      prev[nx] = cur;
      if (nx === b) { const path = []; let p = b; while (p !== null) { path.push(p); p = prev[p]; } return path.reverse(); }
      q.push(nx);
    }
  }
  return null;
}
document.getElementById("pathBtn").onclick = () => {
  const a = document.getElementById("pathA").value, b = document.getElementById("pathB").value;
  const p = shortestPath(a, b);
  if (!p) { pathSet = null; paint(); alert("这两个角色之间没有已记录的关系路径。"); return; }
  pathSet = new Set(p);
  paint();
  document.getElementById("hint").textContent =
    `路径 ${p.length - 1} 跳：` + p.map(id => CH[id].name).join(" → ");
};

    }</div></div>
    <div class="dr-sec"><div class="dr-h">我的笔记</div>
      <textarea class="fal-field" id="drNote" rows="4" placeholder="只存在这台浏览器里，用顶栏导出备份。">${esc(USER[id]?.note || "")}</textarea>
    </div>`;

  document.getElementById("drNote").addEventListener("input", e => {
    const v = e.target.value;
    if (v.trim()) { USER[id] = Object.assign({}, USER[id], { note: v }); }
    else if (USER[id]) { delete USER[id].note; if (!Object.keys(USER[id]).length) delete USER[id]; }
    saveUser();
    document.getElementById("drSaved").textContent = "笔记已记录";
  });
  document.getElementById("drBody").querySelectorAll("[data-go]").forEach(b =>
    b.onclick = () => openDrawer(b.dataset.go));
  document.getElementById("drSaved").textContent = USER[id]?.note ? "已有笔记" : "";

  drawer.hidden = false;
  requestAnimationFrame(() => { drawer.classList.add("is-open"); scrim.classList.add("is-open"); });
  paint();
}
function closeDrawer() {
  drawer.classList.remove("is-open"); scrim.classList.remove("is-open");
  setTimeout(() => { drawer.hidden = true; }, 200);
  selected = null; paint();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
document.getElementById("drClose").onclick = closeDrawer;
scrim.onclick = closeDrawer;
document.getElementById("drFocus").onclick = () => {
  const id = selected; if (!id) return;
  closeDrawer(); go("graph");
  pathSet = new Set([id, ...ADJ[id]]); selected = id; paint();
};
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !drawer.hidden) { closeDrawer(); return; }
  if (ev.key !== "Tab" || drawer.hidden) return;
  const f = drawer.querySelectorAll('button,textarea,input,select,a[href],[tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
});

/* ================================================================ 人物 == */
function opt(sel, list, all) {
  sel.innerHTML = `<option value="">${all}</option>` +
    list.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("");
}
opt(document.getElementById("pfFaction"), G.factions.map(f => ({ v:f.id, t:f.name })), "全部阵营");
opt(document.getElementById("pfRole"), G.roles.map(r => ({ v:r.id, t:r.name })), "全部叙事功能");
opt(document.getElementById("pfPhase"), G.phases.map(p => ({ v:p.id, t:p.short })), "全部阶段");

function renderPeople() {
  const q = document.getElementById("pq").value.trim().toLowerCase();
  const ff = document.getElementById("pfFaction").value;
  const fr = document.getElementById("pfRole").value;
  const fp = document.getElementById("pfPhase").value;
  const list = G.characters.filter(c => {
    if (q && !(c.name + c.alias + c.note).toLowerCase().includes(q)) return false;
    if (ff && !c.arc.some(a => a.faction === ff)) return false;
    if (fr && !c.narrative_role.includes(fr)) return false;
    if (fp && !c.arc.some(a => a.phase === fp)) return false;
    return true;
  });
  document.getElementById("pCount").textContent = `${list.length} / ${G.characters.length} 人`;
  document.getElementById("peopleGrid").innerHTML = list.map(c => {
    const last = c.arc[c.arc.length - 1];
    const deg = ADJ[c.id].size;
    return `<button class="fal-card pcard" data-id="${esc(c.id)}" style="--tone:${stanceColor(last.stance)}">
      <span class="pcard__top"><span class="pcard__name">${esc(c.name)}</span>
      <span class="pcard__alias fal-truncate">${esc(c.alias || "")}</span></span>
      <span class="pcard__roles">${c.narrative_role.map(r => `<span class="fal-badge">${esc(ROLE[r].name)}</span>`).join("")}</span>
      <span class="pcard__foot"><span>${esc(FAC[last.faction]?.name || "")}</span><span>关系 ${deg}</span>
      <span>${c.works.length} 部</span>${USER[c.id]?.note ? "<span>· 有笔记</span>" : ""}</span>
    </button>`;
  }).join("") || `<div class="fal-empty"><strong>没有匹配的角色</strong>换个关键词，或清掉筛选条件。</div>`;
  document.getElementById("peopleGrid").querySelectorAll("[data-id]").forEach(b =>
    b.onclick = () => openDrawer(b.dataset.id));
}
["pq", "pfFaction", "pfRole", "pfPhase"].forEach(id =>
  document.getElementById(id).addEventListener("input", renderPeople));

/* ============================================================ 叙事结构 == */
/** Brandes 介数中心度（无权无向图） */
function betweenness() {
  const ids = G.characters.map(c => c.id);
  const CB = Object.fromEntries(ids.map(i => [i, 0]));
  for (const s of ids) {
    const S = [], P = {}, sigma = {}, d = {};
    ids.forEach(v => { P[v] = []; sigma[v] = 0; d[v] = -1; });
    sigma[s] = 1; d[s] = 0;
    const Q = [s];
    while (Q.length) {
      const v = Q.shift(); S.push(v);
      for (const w of ADJ[v]) {
        if (d[w] < 0) { d[w] = d[v] + 1; Q.push(w); }
        if (d[w] === d[v] + 1) { sigma[w] += sigma[v]; P[w].push(v); }
      }
    }
    const delta = Object.fromEntries(ids.map(i => [i, 0]));
    while (S.length) {
      const w = S.pop();
      for (const v of P[w]) delta[v] += (sigma[v] / sigma[w]) * (1 + delta[w]);
      if (w !== s) CB[w] += delta[w];
    }
  }
  ids.forEach(i => CB[i] /= 2);
  return CB;
}

function renderStructure() {
  const CB = betweenness();
  const rows = G.characters.map(c => ({ c, deg: ADJ[c.id].size, cb: CB[c.id] }))
    .sort((a, b) => b.cb - a.cb || b.deg - a.deg).slice(0, 12);
  const maxCb = Math.max(...rows.map(r => r.cb), 1);
  document.getElementById("rankBox").innerHTML = rows.map((r, i) => `
    <div class="rank__row">
      <span class="rank__i">${i + 1}</span>
      <div style="min-width:0">
        <button class="fal-btn fal-btn--link" data-id="${esc(r.c.id)}">${esc(r.c.name)}</button>
        <div class="rank__bar"><i style="width:${(r.cb / maxCb * 100).toFixed(1)}%"></i></div>
      </div>
      <span class="rank__v">${r.deg}<span class="fal-muted" style="font-weight:400"> / ${r.cb.toFixed(0)}</span></span>
    </div>`).join("");

  document.getElementById("roleBox").innerHTML = G.roles.map(role => {
    const hit = G.characters.filter(c => c.narrative_role.includes(role.id));
    return `<div>
      <div class="rolegrid__h"><span class="rolegrid__n">${esc(role.name)}</span>
        <span class="fal-micro">${hit.length} 人 · ${esc(role.desc)}</span></div>
      <div class="chips" style="margin-top:5px">${
        hit.map(c => `<button class="chipbtn" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join("")
      }</div></div>`;
  }).join("");

  // 传承链：沿 legacy 边走
  const leg = G.relations.filter(r => r.type === "legacy");
  const targets = new Set(leg.map(r => r.target));
  const heads = [...new Set(leg.map(r => r.source))].filter(s => !targets.has(s));
  const chains = heads.map(h => {
    const path = [h]; let cur = h;
    for (;;) {
      const nx = leg.find(r => r.source === cur && !path.includes(r.target));
      if (!nx) break; path.push(nx.target); cur = nx.target;
    }
    return path;
  }).filter(p => p.length > 1).sort((a, b) => b.length - a.length);
  document.getElementById("chainBox").innerHTML = chains.map(p => `<div class="chain">${
    p.map((id, i) => (i ? `<svg class="icon icon--sm"><use href="#i-arrow"/></svg>` : "") +
      `<button class="fal-btn fal-btn--link" data-id="${esc(id)}">${esc(CH[id].name)}</button>`).join("")
  }<span class="fal-badge">${p.length - 1} 次交接</span></div>`).join("")
    || `<div class="fal-empty">没有 legacy 关系。</div>`;

  // 阵营流动
  const flow = G.characters.filter(c => new Set(c.arc.map(a => a.faction)).size > 1
    || new Set(c.arc.map(a => a.stance)).size > 1);
  document.getElementById("flowBox").innerHTML = flow.map(c => `<div class="chain">
    <button class="fal-btn fal-btn--link" data-id="${esc(c.id)}">${esc(c.name)}</button>
    ${c.arc.map((a, i) => (i ? `<svg class="icon icon--sm"><use href="#i-arrow"/></svg>` : "") +
      `<span class="fal-badge">${esc(FAC[a.faction]?.name || "")} · ${esc(STANCE_LABEL[a.stance] || a.stance)}</span>`).join("")}
  </div>`).join("") + `<p class="fal-micro" style="margin-top:10px">${flow.length} / ${G.characters.length} 人在不同阶段换过阵营或立场。</p>`;

  document.querySelectorAll("#v-structure [data-id]").forEach(b =>
    b.onclick = () => openDrawer(b.dataset.id));
}

/* ============================================================ 资料边界 == */
function renderBoundary() {
  const inf = G.relations.filter(r => r.confidence === "inferred");
  document.getElementById("boundaryIntro").innerHTML = `
    <p><b>范围。</b>${esc(G.meta.scope)}。不含 Sony 蜘蛛、Fox 变种、多元拼盘与街头线。</p>
    <p style="margin-top:10px"><b>数据来源。</b>${esc(G.meta.source_note)}</p>
    <p style="margin-top:10px"><b>时间轴口径。</b>事件按叙事推进顺序排列，开场闪回（重生计划、奎尔被带走、光速引擎爆炸）归位到最前，其余基本等同上映顺序。可见区间是半开区间 <span class="fal-mono">[生效, 转变)</span>。</p>
    <p style="margin-top:10px"><b>角色死亡不写进关系。</b>关系的「转变」只表示性质改变（同盟变对立、敌对变和解）；角色是否还活着由阶段切片承担，时间游标越过后节点变灰。</p>
    <p style="margin-top:10px"><b>叙事功能与阵营分组是个人整理</b>，不是官方设定。同一个角色可以同时占多个叙事功能。</p>
    <p style="margin-top:10px"><b>不使用任何角色形象、剧照或 logo</b>，人物一律以文字节点呈现。</p>
    <p style="margin-top:10px" class="fal-micro">当前数据：${G.characters.length} 人 · ${G.relations.length} 条关系 · ${G.events.length} 个事件 · 批次 ${esc(G.meta.batch)} · ${esc(G.meta.generated)}</p>`;
  document.getElementById("infCount").textContent =
    `${inf.length} / ${G.relations.length} 条（${(inf.length / G.relations.length * 100).toFixed(0)}%）`;
  document.getElementById("infBox").innerHTML = inf.map(r => `<div class="rel">
    <span class="rel__t" style="--rc:${TYPE_COLOR[r.type]}">${esc(RT[r.type].name)}</span>
    <div class="rel__b"><button class="fal-btn fal-btn--link" data-id="${esc(r.source)}">${esc(CH[r.source].name)}</button>
      <span class="fal-muted">—</span>
      <button class="fal-btn fal-btn--link" data-id="${esc(r.target)}">${esc(CH[r.target].name)}</button>
      <div class="rel__n">${esc(r.note)}</div></div></div>`).join("");
  document.querySelectorAll("#v-boundary [data-id]").forEach(b =>
    b.onclick = () => openDrawer(b.dataset.id));
}

/* ================================================================ 路由 == */
let curView = "graph";
function go(v) {
  curView = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("is-active", s.id === "v-" + v));
  document.querySelectorAll(".fal-tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === v)));
  if (v === "people") renderPeople();
  if (v === "structure") renderStructure();
  if (v === "boundary") renderBoundary();
  if (v === "graph") { resize(); rebuild(0.5); }
}
document.querySelectorAll(".fal-tab").forEach(t => t.onclick = () => go(t.dataset.view));

/* ============================================================ 导入导出 == */
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({
    schema_version: 1, app: "marvel-graph", exported_at: new Date().toISOString(), state: USER
  }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `marvel-graph-notes-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const st = d.state;
    if (!st || typeof st !== "object" || Array.isArray(st)) throw new Error("结构不符");
    let n = 0;
    for (const [k, v] of Object.entries(st)) {
      if (!CH[k] || !v || typeof v !== "object") continue;              // 丢弃未知角色
      const note = typeof v.note === "string" ? v.note.slice(0, 4000) : "";
      if (note.trim()) { USER[k] = { note }; n++; }
    }
    saveUser(); renderPeople();
    alert(`导入完成：接受 ${n} 条笔记。未知角色与非法字段已丢弃。`);
  } catch (err) { alert("导入失败：文件不是本页面导出的备份。"); }
  e.target.value = "";
});

/* ================================================================ 启动 == */
const selA = document.getElementById("pathA"), selB = document.getElementById("pathB");
const optionsHTML = G.characters.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
selA.innerHTML = optionsHTML; selB.innerHTML = optionsHTML;
selA.value = "tony-stark"; selB.value = "kamala-khan";

(function init() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  setTheme(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  resize(); scatter(); paintCursor(); computeGraph(); paint(); kick(1);
  markSaved(Object.keys(USER).length ? "已保存" : "无本地数据");
})();

let rt = null;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (curView === "graph") { resize(); rebuild(0.5); } }, 160);
});
</script>
